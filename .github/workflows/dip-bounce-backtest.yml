name: Dip Bounce Hypothesis Backtest

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Run dip-bounce backtest
        run: python -m trader.dip_bounce_backtest

      - name: Commit backtest output
        run: |
          git config user.name "day-trading-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/dip_bounce_backtest/
          if git diff --cached --quiet; then
            echo "No backtest output changes to commit."
          else
            git commit -m "chore: update dip-bounce backtest results ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push origin HEAD:${{ github.ref_name }}
          fi
